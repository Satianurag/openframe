services:
  studio:
    build: .
    ports:
      - "127.0.0.1:${OPENFRAME_PORT:-8000}:8000"
    volumes:
      - openframe-data:/data
    environment:
      OPENFRAME_DATA_DIR: /data
      OPENFRAME_ALLOWED_ORIGINS: http://localhost:${OPENFRAME_PORT:-8000},http://127.0.0.1:${OPENFRAME_PORT:-8000}
      OPENFRAME_COMFY_URL: ${OPENFRAME_COMFY_URL:-http://host.docker.internal:8188}
      OPENFRAME_COMFY_CLOUD_API_KEY: ${OPENFRAME_COMFY_CLOUD_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  openframe-data:
